name: Caveworkers CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: caveworkers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, lint, and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      VITEST: true
      ALWAYS_ON_WORKER_ENABLED: false
      MCP_TOKEN_ENCRYPTION_KEY: ci-test-encryption-key
      GOOGLE_OAUTH_CLIENT_ID: ci-google-client-id
      GOOGLE_OAUTH_CLIENT_SECRET: ci-google-client-secret
      RAZORPAY_KEY_SECRET: ci-payment-secret
      RAZORPAY_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: TypeScript lint
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Whitespace validation
        run: git diff --check
