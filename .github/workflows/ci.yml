name: CaveWorkers CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q .
      - name: Lint
        run: python -m ruff check . || true

  regression:
    runs-on: ubuntu-latest
    needs: quality
    env:
      CAVEWORKERS_ENV: development
      FLASK_SECRET: ci-test-secret
      FIREBASE_PROJECT_ID: ci-test
      FIREBASE_SERVICE_ACCOUNT_PATH: ""
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Phase regression tests
        run: |
          python test_phase1.py
          python test_phase2.py
          python test_phase3.py
          python test_phase4.py
      - name: MCP redesign verification
        run: python verify_mcp_redesign.py

  integration:
    runs-on: ubuntu-latest
    needs: regression
    continue-on-error: true
    env:
      CAVEWORKERS_ENV: development
      FLASK_SECRET: ci-integration-secret
      FIREBASE_PROJECT_ID: ci-integration
      FIREBASE_SERVICE_ACCOUNT_PATH: ""
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Master plan verification (requires specialist services)
        run: python verify_master_plan.py || echo "SKIPPED: specialist services not available in CI"

  e2e:
    runs-on: ubuntu-latest
    needs: regression
    env:
      CAVEWORKERS_ENV: development
      FLASK_SECRET: ci-e2e-secret
      FIREBASE_PROJECT_ID: ci-e2e
      FIREBASE_SERVICE_ACCOUNT_PATH: ""
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: E2E test suite
        run: python -m pytest tests/ -v
